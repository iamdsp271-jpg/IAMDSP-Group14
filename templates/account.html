{% extends "base.html" %}{% block title %}Change Password{% endblock %}
{% block content %}<h1>Change Password</h1><div class="card" style="max-width:460px"><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Old password</label><input type="password" name="old" required><label>New password (min. 8 characters)</label><input type="password" name="new" required><label>Type the new password again</label><input type="password" name="again" required>
<p style="margin-top:14px"><button class="btn">Change password</button></p></form></div>{% endblock %}
