{% extends "base.html" %}{% block title %}Activity Log{% endblock %}
{% block content %}<h1>Activity Log</h1><p class="sub">Last 100 actions recorded by the system</p>
<div class="tablewrap"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr>{% for a in rows %}<tr><td>{{ a.at }}</td><td>{{ a.username or '-' }}</td><td>{{ a.action }}</td><td>{{ a.detail }}</td></tr>{% endfor %}</table></div>{% endblock %}
